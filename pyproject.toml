[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "evo-verifier"
version = "0.1.0"
description = "Shared ground for the Evo-Articraft verifier: items, labels, report contract, alignment."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.0.0", "ruff>=0.11.0"]

[tool.setuptools.packages.find]
include = ["evo_verifier*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "PERF", "PLE", "PLW", "PTH", "RUF", "SIM", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
